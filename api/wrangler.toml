name = "cubeforge-api"
main = "src/index.ts"
compatibility_date = "2024-06-20"

# KV namespace for server registry
kv_namespaces = [
  { binding = "CUBEFORGE_REGISTRY", id = "296c93195b224bdba5484f877102c458", preview_id = "server_registry_preview" }
]

# Durable Object do painel web remoto (Cubicase Plus) — um "canal" por
# dispositivo, ver src/durable-objects/host-channel.ts e
# plans/remote-web-panel-plan.md. new_sqlite_classes porque contas novas do
# Workers só ganham o storage backend SQLite para Durable Objects (o backend
# antigo baseado em key-value já não é oferecido para namespaces novos).
[[durable_objects.bindings]]
name = "HOST_CHANNEL"
class_name = "HostChannel"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["HostChannel"]

# Sala de sinalização do transporte P2P (cubicase-link): um DO por servidor, ver
# src/durable-objects/link-room.ts e plans/p2p-link-transport-plan.md. Segredos:
#   wrangler secret put LINK_TOKEN_SECRET   (HMAC dos tokens de sinalização)
#   wrangler secret put TURN_SECRET         (mesmo segredo do coturn, use-auth-secret)
# Variáveis opcionais (wrangler.toml [vars] ou dashboard): TURN_URLS, STUN_URLS, LINK_MAX_GUESTS,
# TURN_DISABLED=1 (corta a emissão de credenciais do relay na hora — freio de custo).
[[durable_objects.bindings]]
name = "LINK_ROOM"
class_name = "LinkRoom"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["LinkRoom"]

# Environment variables (configurable)
[vars]
SERVER_TTL_SECONDS = "14400"
HEARTBEAT_TIMEOUT_SECONDS = "300"
HEARTBEAT_EXPIRE_SECONDS = "600"
SHORT_CODE_LENGTH = "6"
API_BASE_URL = "https://api.cubeforge.dev"
# Relay TURN (coturn na VM da Oracle, ver infra/relay/). Só passa a ser usado quando o segredo TURN_SECRET existe
# (wrangler secret put TURN_SECRET); TURN_DISABLED=1 (secret) corta o relay na hora.
TURN_URLS = "turn:turn.cubicase.net:3478,turn:turn.cubicase.net:3478?transport=tcp,turns:turn.cubicase.net:443?transport=tcp"

# Link de convite personalizado (Cubicase Plus) — play.cubicase.net/<slug>.
# A zona DNS de cubicase.net está no HostGator (e-mail e outras coisas
# dependem dela), não no Cloudflare, então não dá pra usar "Custom Domain" do
# Workers aqui. A página em si é um site estático no GitHub Pages (mesmo
# esquema de docs/entrar/, ver play-site/ na raiz do repo) — este Worker só
# expõe GET /api/v1/servers/by-slug/{slug} pra ela resolver o slug antes de
# tentar o deep link. Nenhuma config de domínio extra precisa deste Worker.

# Endereço de conexão personalizado (Cubicase Plus) — <nome>.link.cubicase.net
# no lugar de "localhost:<porta>" dentro do Minecraft. Também na zona
# HostGator: um único registro DNS estático, mantido manualmente fora deste
# Worker, `*.link.cubicase.net -> A 127.0.0.1` — resolve qualquer nome sob
# esse domínio pro loopback onde o cubicase-link do convidado escuta depois de
# conectar (ver handleSetConnectName/handleRemoveConnectName em src/index.ts).
# Este Worker nunca fala com DNS nenhum, só guarda o alias no KV, igual o slug.

# CORS configuration
[env.production]
vars = { ENVIRONMENT = "production" }

[env.preview]
vars = { ENVIRONMENT = "preview" }
