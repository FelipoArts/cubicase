name: Tests

# Roda a bateria de testes (Rust, frontend, API) em todo push/PR pra main —
# hoje só existe o workflow de release, que builda e assina sem nunca rodar
# `npm run test`. Sem isso, uma tag pode virar release com testes quebrados.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.27" # última correção da série (go.mod exige 1.26+; a 1.24 está sem suporte e a stdlib dela tem CVEs)

      # Transporte P2P: testes com conexões WebRTC reais em loopback.
      - name: Test cubicase-link sidecar
        working-directory: src-tauri/sidecars/cubicase-link
        run: go test ./... -count=1 -timeout 300s

      # O tauri-build (build.rs do cargo test) exige o sidecar declarado em
      # tauri.conf.json (externalBin) — o binário fica fora do git, então o CI
      # compila ele antes, igual ao release.yml.
      - name: Build cubicase-link sidecar
        working-directory: src-tauri/sidecars/cubicase-link
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ../../binaries | Out-Null
          go build -o ../../binaries/cubicase-link-x86_64-pc-windows-msvc.exe .

      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck and lint (frontend)
        run: |
          npx tsc --noEmit
          npx eslint src

      - name: Install API dependencies
        working-directory: api
        run: npm ci

      - name: Run tests (backend + frontend + API)
        run: npm run test
