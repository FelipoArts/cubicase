name: Tests

# Roda a bateria de testes (Rust, frontend, API) em todo push/PR pra main —
# hoje só existe o workflow de release, que builda e assina sem nunca rodar
# `npm run test`. Sem isso, uma tag pode virar release com testes quebrados.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      # O tauri-build (build.rs do cargo test) exige o sidecar declarado em
      # tauri.conf.json (externalBin) — o binário fica fora do git, então o CI
      # compila ele antes, igual ao release.yml.
      - name: Build tsnet-node sidecar
        working-directory: src-tauri/sidecars/tsnet-node
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ../../binaries | Out-Null
          go build -o ../../binaries/tsnet-node-x86_64-pc-windows-msvc.exe .

      - name: Install frontend dependencies
        run: npm ci

      - name: Install API dependencies
        working-directory: api
        run: npm ci

      - name: Run tests (backend + frontend + API)
        run: npm run test
